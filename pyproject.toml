[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-grading-agent"
version = "0.1.0"
description = "AI-assisted assignment grading backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "SQLAlchemy>=2.0.32",
    "alembic>=1.13.2",
    "PyMySQL>=1.1.1",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    "httpx>=0.27.0",
    "email-validator>=2.2.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
